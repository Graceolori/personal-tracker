{% extends "base.html" %}

{% block title %}Add User | Personal Tracker{% endblock %}

{% block content %}
<section class="card">
    <h2>Add User</h2>
    <p>Create a new tracker user with a name and email address.</p>

    <form method="post">
        <label for="name">
            Name
            <input id="name" name="name" type="text" value="{{ name }}" placeholder="jane doe" required>
        </label>

        <label for="email">
            Email
            <input id="email" name="email" type="email" value="{{ email }}" placeholder="name@example.com" required>
        </label>

        <button type="submit" class="button">Save user</button>
    </form>
</section>
{% endblock %}
